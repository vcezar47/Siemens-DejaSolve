<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déjà Solve</title>
<style>
  :root{
    --bg:#0e1416; --panel:#141d20; --panel-2:#1a2529; --line:#243237;
    --ink:#e6eef0; --dim:#8fa3a9; --faint:#5d7076;
    --teal:#00b3b3; --teal-dim:#0a6b6b;
    --ok:#3ddc97; --refuse:#ff6b5e; --warn:#ffb454; --skip:#3a4a50;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
         padding:18px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:19px;letter-spacing:.2px}
  h1 span{color:var(--teal)}
  .tagline{color:var(--dim);font-size:13px}
  .badges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  /* availability is a status, so it gets status colour, not just a suffix.
     Option colours render in the popup on Chromium/Firefox; the closed select
     is coloured directly so the state is visible without opening it. */
  select option.on{color:var(--ok)}
  select option.off{color:var(--refuse)}
  select.on{color:var(--ok)} select.off{color:var(--refuse)}
  .badge{font:12px/1 var(--mono);color:var(--dim);background:var(--panel-2);
         border:1px solid var(--line);border-radius:99px;padding:6px 11px;white-space:nowrap}
  .badge b{color:var(--ink);font-weight:600}
  main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(420px,1.35fr);
       gap:20px;padding:20px 26px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel > h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.9px;
              color:var(--dim);padding:12px 16px;border-bottom:1px solid var(--line);
              font-weight:600}
  .body{padding:16px}
  .samples{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
         background:var(--panel-2);color:var(--ink);padding:7px 12px;transition:.14s}
  button:hover{border-color:var(--teal-dim);color:var(--teal)}
  button.chip{font:12px/1 var(--mono);padding:7px 10px}
  button.chip.on{border-color:var(--teal);color:var(--teal);background:#0d2426}
  textarea{width:100%;height:260px;resize:vertical;background:var(--bg);color:var(--ink);
           border:1px solid var(--line);border-radius:8px;padding:12px;
           font:12.5px/1.55 var(--mono);tab-size:2}
  textarea:focus{outline:none;border-color:var(--teal-dim)}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .run{background:var(--teal);border-color:var(--teal);color:#04201f;font-weight:650;
       padding:9px 20px}
  .run:hover{background:#00cfcf;color:#04201f}
  .run:disabled{opacity:.5;cursor:default}
  select{font:13px var(--mono);background:var(--panel-2);color:var(--ink);
         border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  .hint{color:var(--faint);font-size:12px}

  /* pipeline */
  .stage{display:grid;grid-template-columns:26px 128px 1fr;gap:12px;align-items:start;
         padding:13px 16px;border-bottom:1px solid var(--line);
         opacity:0;transform:translateY(5px);animation:in .32s ease forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .stage:last-child{border-bottom:none}
  .dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
       font-size:11px;font-weight:700;margin-top:1px}
  .ok .dot{background:rgba(61,220,151,.14);color:var(--ok);border:1px solid var(--ok)}
  /* warned and blocked are different statements, so they get different colour:
     amber is a risk the engineer may accept, red is a fact they cannot. */
  .warned .dot{background:rgba(255,180,84,.14);color:var(--warn);border:1px solid var(--warn)}
  .blocked .dot{background:rgba(255,107,94,.14);color:var(--refuse);border:1px solid var(--refuse)}
  .skipped .dot{background:transparent;color:var(--skip);border:1px dashed var(--skip)}
  .stage .name{font-weight:600;font-size:13.5px}
  .stage .sub{color:var(--faint);font-size:11.5px}
  .stage .msg{font:12.8px/1.5 var(--mono);color:var(--dim);padding-top:1px}
  .ok .msg{color:var(--ink)}
  .warned .msg{color:var(--warn)}
  .blocked .msg{color:var(--refuse)}
  .skipped .name,.skipped .sub,.skipped .msg{color:var(--skip)}
  .note{margin-top:8px;padding:9px 11px;border-left:2px solid var(--refuse);
        background:rgba(255,107,94,.06);color:var(--dim);font-size:12.5px;line-height:1.5}
  .sugg{margin-top:8px;font:12px/1.6 var(--mono);color:var(--dim)}
  .foreign{margin-top:8px;font:11.8px/1.7 var(--mono);color:var(--dim);
           border-left:2px solid var(--teal-dim);padding-left:10px}
  .foreign .fk{display:inline-block;min-width:190px;color:var(--faint)}
  .sugg b{color:var(--warn);font-weight:600}

  /* headline */
  .headline{display:flex;gap:22px;align-items:center;flex-wrap:wrap;
            padding:16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint)}
  .metric .v{font:22px/1.15 var(--mono);font-weight:650}
  .metric .v.cold{color:var(--refuse)} .metric .v.warm{color:var(--ok)}
  .metric .v.nominal{color:var(--warn)}
  .metric .v.same{color:var(--teal);font-size:17px}
  .arrow{color:var(--faint);font-size:20px}
  .verdictbar{padding:11px 16px;font:12.8px var(--mono);border-bottom:1px solid var(--line)}
  .verdictbar.ok{color:var(--ok);background:rgba(61,220,151,.07)}
  .verdictbar.warned{color:var(--warn);background:rgba(255,180,84,.07)}
  .verdictbar.blocked{color:var(--refuse);background:rgba(255,107,94,.07)}

  /* the report: what the engineers asked for instead of a silent refusal --
     what happened, what it means, and what they can do about it */
  .report{padding:14px 16px;border-bottom:1px solid var(--line)}
  .report.ok{background:rgba(61,220,151,.05);border-left:3px solid var(--ok)}
  .report.warned{background:rgba(255,180,84,.07);border-left:3px solid var(--warn)}
  .report.blocked{background:rgba(255,107,94,.07);border-left:3px solid var(--refuse)}
  .report .rhead{font:11px var(--mono);letter-spacing:1.1px;text-transform:uppercase;
                 margin-bottom:6px;font-weight:600}
  .report.ok .rhead{color:var(--ok)}
  .report.warned .rhead{color:var(--warn)}
  .report.blocked .rhead{color:var(--refuse)}
  .report .rreason{font:13px/1.5 var(--mono);color:var(--ink)}
  .report .rcons{color:var(--dim);font-size:12.5px;margin-top:5px;line-height:1.55}
  .ovr{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ovrhint{flex:1 0 100%;color:var(--faint);font-size:12px}
  .ovr input{flex:1 1 160px;min-width:120px;background:var(--bg);color:var(--ink);
             border:1px solid var(--line);border-radius:7px;padding:7px 10px;
             font:12.5px var(--mono)}
  .ovr input:focus{outline:none;border-color:var(--warn)}
  .ovrbtn{border-color:var(--warn);color:var(--warn)}
  .ovrbtn:hover{background:rgba(255,180,84,.12);border-color:var(--warn);color:var(--warn)}

  /* simulation is a departmental activity, so an accepted risk is attributed */
  .audit{padding:12px 16px;border-top:1px solid var(--line);background:var(--panel-2)}
  .audit .ahead{font:11px var(--mono);letter-spacing:1.1px;text-transform:uppercase;
                color:var(--faint);margin-bottom:7px;font-weight:600}
  .audit .arow{font:11.8px/1.7 var(--mono);color:var(--dim)}
  .audit .at{color:var(--faint)}
  .audit b{color:var(--ink);font-weight:600}

  table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;
     text-transform:uppercase;letter-spacing:.6px;padding:9px 16px;
     border-bottom:1px solid var(--line)}
  td{padding:7px 16px;border-bottom:1px solid rgba(36,50,55,.5)}
  tr:last-child td{border-bottom:none}
  td.num{text-align:right;color:var(--ink)}
  td.unit{color:var(--faint)} td.raw{color:var(--teal-dim);font-size:11.5px}
  td.miss{color:var(--refuse);letter-spacing:.5px}
  .empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:13.5px}
  .err{margin:16px;padding:12px;border:1px solid var(--refuse);border-radius:8px;
       color:var(--refuse);font:12.5px var(--mono)}

  /* --- evidence: measured offline, shown beside the live pipeline ---------
     Labelled rather than blended in. Everything above this line is the service
     doing something now; everything below it is a number `run_all.py`
     produced. A demo that shows both without saying which is which is the
     failure mode this project is about. */
  .ev{padding:0 26px 26px}
  .ev > h2{margin:0 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;
           color:var(--dim);font-weight:600}
  .ev .evsub{color:var(--faint);font-size:12px;margin-bottom:14px}
  .ev .evsub code{color:var(--teal);background:var(--panel-2);padding:2px 6px;
                  border-radius:5px;font-size:11.5px}
  .evgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card h3{margin:0 0 2px;font-size:13.5px;font-weight:650}
  .card .cn{color:var(--faint);font-size:11.5px;margin-bottom:11px}
  .card .lede{font:12.5px/1.55 var(--mono);color:var(--dim);margin-top:10px}
  .card .lede b{color:var(--ink)}

  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:78px 1fr 46px;gap:9px;align-items:center;
       font:12px var(--mono)}
  .bar .bl{color:var(--dim);text-align:right}
  .bar .bt{height:15px;border-radius:4px;background:var(--teal-dim);opacity:.85}
  .bar .bv{color:var(--ink);font-weight:600}
  .bar.best .bt{background:var(--ok)} .bar.best .bv{color:var(--ok)}
  .bar.worst .bt{background:var(--refuse)} .bar.worst .bv{color:var(--refuse)}
  .bar.mid .bt{background:var(--warn)} .bar.mid .bv{color:var(--warn)}

  .cmp{width:100%;border-collapse:collapse;font:12px var(--mono)}
  .cmp th{color:var(--faint);font-size:10.5px;text-transform:uppercase;
          letter-spacing:.6px;padding:0 0 7px;text-align:right;font-weight:600}
  .cmp th:first-child{text-align:left}
  .cmp td{padding:5px 0;border-top:1px solid rgba(36,50,55,.6);text-align:right;color:var(--ink)}
  .cmp td:first-child{text-align:left;color:var(--dim)}
  .cmp tr.alarm td{color:var(--refuse);font-weight:650}
  .cmp tr.alarm td:first-child{color:var(--refuse)}
  .cmp tr.good td{color:var(--ok);font-weight:650}
  .cmp tr.good td:first-child{color:var(--ok)}

  .kv{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px}
  .kv > div{min-width:88px}
  .kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint)}
  .kv .v{font:17px/1.3 var(--mono);font-weight:650}
  .kv .v.ok{color:var(--ok)} .kv .v.warn{color:var(--warn)} .kv .v.bad{color:var(--refuse)}
  .kv .v.dim{color:var(--dim);font-size:14px}
  .chart{margin-top:4px}
  .chart text{fill:var(--faint);font:10px var(--mono)}
  .evmissing{color:var(--warn);font:12px var(--mono);padding:10px 0}
  /* the numbers above are only worth reading if the invariants under them hold */
  .inv{font:11.5px var(--mono);padding:8px 11px;margin-bottom:12px;border-radius:7px;
       border:1px solid var(--line);background:var(--panel)}
  .inv.ok{color:var(--ok);border-color:rgba(61,220,151,.35)}
  .inv.bad{color:var(--refuse);border-color:var(--refuse)}
  .inv b{color:var(--ink)}
</style>
</head>
<body>
<header>
  <h1>Déjà <span>Solve</span></h1>
  <div class="tagline">Every solver run starts from zero. This one doesn't.</div>
  <div class="badges" id="badges"></div>
</header>

<main>
  <section class="panel">
    <h2>Run artifact</h2>
    <div class="body">
      <div class="samples" id="samples"></div>
      <textarea id="text" spellcheck="false"
                placeholder="Paste a solver log, an input deck, or an engineer's note — in any format, any language. Or drop a file here."></textarea>
      <div class="row">
        <button class="run" id="run">Analyse</button>
        <select id="backend" title="ingest backend"></select>
        <span class="hint" id="hint"></span>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Pipeline</h2>
    <div id="out"><div class="empty">Pick an artifact and press Analyse.</div></div>
  </section>
</main>

<section class="ev">
  <h2>Evidence</h2>
  <div class="evsub">Measured offline, not computed for this page &mdash;
    regenerate every number with <code>python run_all.py</code>.</div>
  <div id="evidence"></div>
</section>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => (v === null || v === undefined) ? '' :
  (Math.abs(v) >= 1e-4 && Math.abs(v) < 1e6) ? (+v.toPrecision(6)).toString()
                                             : v.toExponential(3);

let SAMPLES = [];

//: label for each backend id. `auto` is always offered and always works —
//: it degrades to the parser rather than failing.
const BACKEND_LABEL = {auto:'auto', hybrid:'hybrid (parser + local model)',
                       rules:'rules only (instant)',
                       ollama:'Ollama only (local)'};

//: last health payload, so `explain()` can describe the current selection
//: without another round trip
let HEALTH = {};

function renderHealth(h){
  HEALTH = h;
  const B = h.backends || {};
  const ready = Object.keys(B).filter(k => B[k].available);

  // "cases" was true until the failed runs were kept as well. Both halves, and
  // the failed one is amber rather than red: a failed run is not an error, it is
  // the more expensive half of what the archive knows.
  const failed = h.archive_failed
    ? ` <span style="color:var(--warn)">&middot; <b>${h.archive_failed}</b> failed</span>` : '';
  $('#badges').innerHTML =
    `<span class="badge">archive <b>${h.archive_size}</b> solved${failed}</span>` +
    `<span class="badge">ingest <b>${ready.join(' + ') || 'none'}</b></span>` +
    (B.ollama && B.ollama.available
      ? `<span class="badge" style="color:var(--ok)">local <b>on-prem</b></span>` : '');

  // Whatever /api/health offers is what the page offers — the list is not
  // written out here, so a backend can never exist on one side only.
  // Unavailable ones stay visible with the reason in the label; hiding them
  // is how a demo ends up with an unexplained missing feature.
  const sel = $('#backend');
  const keep = sel.value;                     // survive a refresh mid-demo
  const markup =
    `<option class="on" value="auto">ingest: auto</option>` +
    Object.keys(B).map(k =>
      `<option class="${B[k].available ? 'on' : 'off'}" value="${k}"` +
      `${B[k].available ? '' : ' data-off="1"'}>ingest: ${BACKEND_LABEL[k]||k}` +
      `${B[k].available ? '' : ' - unavailable'}</option>`).join('');
  // Rebuilding on every poll would close an open dropdown under the user's
  // cursor, so only touch the DOM when the availability picture changed.
  if(sel.innerHTML !== markup){
    sel.innerHTML = markup;
    if([...sel.options].some(o => o.value === keep)) sel.value = keep;
  }
  explain();
}

function explain(){
  const sel = $('#backend');
  const B = HEALTH.backends || {};
  const ready = Object.keys(B).filter(k => B[k].available);
  const o = sel.selectedOptions[0];
  const k = sel.value;
  $('#hint').textContent = (k === 'auto')
    ? `auto -> ${ready.includes('hybrid') ? 'hybrid' : 'rules'}`
    : (B[k] ? B[k].detail : '');
  const off = !!(o && o.dataset.off);
  $('#hint').style.color = off ? 'var(--refuse)' : 'var(--ok)';
  sel.classList.toggle('off', off);
  sel.classList.toggle('on', !off);
}

//: Health is a live property, not a load-time fact: Ollama can come up or go
//: away while the page sits open. Re-read it rather than leaving the page
//: asserting something that stopped being true — a demo that says
//: "unavailable" about a backend you just fixed is the worst kind of wrong.
async function refreshHealth(){
  try{ renderHealth(await (await fetch('/api/health')).json()); }
  catch(e){ /* transient: keep showing the last known state */ }
}


//: Everything below renders `/api/evidence` -- numbers `run_all.py` measured,
//: never anything the service computed for this page view. The heading says so
//: rather than leaving the viewer to work out which half is which.
const f2 = v => (v === null || v === undefined) ? '-' : (+v).toFixed(2);
const f3 = v => (v === null || v === undefined) ? '-' : (+v).toFixed(3);

function bars(arms, opts){
  const vals = arms.map(a => a.mean).filter(v => v != null);
  const max = Math.max(...vals);
  const best = Math.min(...vals);
  return `<div class="bars">` + arms.map(a => {
    const cls = a.mean === best ? 'best' : a.mean === max ? 'worst'
              : (opts && opts.mid === a.label) ? 'mid' : '';
    const w = a.mean == null ? 0 : (a.mean / max) * 100;
    return `<div class="bar ${cls}"><div class="bl">${esc(a.label)}</div>` +
           `<div><div class="bt" style="width:${w}%"></div></div>` +
           `<div class="bv">${f2(a.mean)}</div></div>`;
  }).join('') + `</div>`;
}

//: A hand-drawn SVG rather than a charting library: the page is one file with
//: no CDN, and this is 30 lines. Log x because the interesting range spans 7 to
//: 1007; y is a percentage so both series share one axis honestly.
function lineChart(series, xs){
  const W = 340, H = 150, L = 30, R = 8, T = 10, B = 24;
  const lx = v => Math.log10(v);
  const x0 = lx(Math.min(...xs)), x1 = lx(Math.max(...xs));
  const px = v => L + (lx(v) - x0) / (x1 - x0) * (W - L - R);
  const py = v => H - B - (v / 100) * (H - T - B);
  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${py(v)}" x2="${W - R}" y2="${py(v)}"
           stroke="#243237" stroke-width="1"/>
     <text x="${L - 5}" y="${py(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const ticks = [xs[0], xs[Math.floor(xs.length / 2)], xs[xs.length - 1]].map(v =>
    `<text x="${px(v)}" y="${H - 8}" text-anchor="middle">${v}</text>`).join('');
  const paths = series.map(s => {
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${px(p[0])},${py(p[1])}`).join(' ');
    const dots = s.pts.map(p =>
      `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="3" fill="${s.color}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join('');
  const key = series.map((s, i) =>
    `<text x="${L + 4}" y="${T + 12 + i * 13}" fill="${s.color}">${esc(s.label)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">
            ${grid}${ticks}${paths}${key}</svg>`;
}

function drawEvidence(ev){
  const S = ev.sections || {};
  const cards = [];

  if(S.phase1){
    const a = S.phase1;
    cards.push(`<div class="card"><h3>${esc(a.title)}</h3>
      <div class="cn">${a.n} fresh cases &middot; ${esc(a.basis)}</div>
      ${bars(a.arms, {mid: 'nominal'})}
      <div class="lede">The <b>nominal</b> guess is the baseline that matters &mdash;
        a flat start is one nobody ships. <b>31% fewer iterations</b> than a good
        engineering guess.</div></div>`);
  }

  if(S.surrogate){
    const s = S.surrogate;
    cards.push(`<div class="card"><h3>${esc(s.title)}</h3>
      <div class="cn">${s.n} cases &middot; ${esc(s.basis)}</div>
      ${bars(s.arms, {mid: 'nominal'})}
      <div class="lede">And it is <b>not an answer</b>: median residual
        <b>${(+s.residual_median).toFixed(2)}</b> against a solver tolerance of
        ${s.solver_tolerance}. <b>${s.were_solutions} of ${s.n}</b> predictions were
        solutions. The best starting guess is the one that satisfies nothing.</div></div>`);
  }

  if(S.fold){
    const f = S.fold;
    cards.push(`<div class="card"><h3>${esc(f.title)}</h3>
      <div class="cn">the fold circuit, where the guess selects the answer &middot; ${f.n} cases</div>
      <table class="cmp"><thead><tr><th></th><th>retrieval</th><th>prediction</th></tr></thead>
      <tbody>${f.rows.map(r =>
        `<tr class="${r.alarm ? 'alarm' : r.good ? 'good' : ''}">
           <td>${esc(r.label)}</td><td>${r.retrieval}</td><td>${r.prediction}</td></tr>`).join('')}
      </tbody></table>
      <div class="lede">The prediction wins on speed and is <b>ten times more dangerous</b>
        unverified. Retrieval fails loudly 49 times; the prediction converges and is
        wrong 40 times. <b>Verified, both are zero.</b></div></div>`);
  }

  if(S.failures){
    const x = S.failures;
    cards.push(`<div class="card"><h3>${esc(x.title)}</h3>
      <div class="cn">${x.archive.succeeded} solved / ${x.archive.failed} failed in the archive</div>
      <div class="kv">
        <div><div class="k">will this run die?</div>
             <div class="v ok">${f3(x.auc_hard_case)}</div></div>
        <div><div class="k">control</div>
             <div class="v dim">${f3(x.auc_control)}</div></div>
        <div><div class="k">will reuse go wrong?</div>
             <div class="v warn">${f3(x.auc_bad_transfer)}</div></div>
      </div>
      <div class="lede">AUC, 0.50 is a coin flip. The failures carry information the
        successes do not (<b>0.65 &rarr; 0.77</b>) &mdash; but they predict a hard
        <b>case</b>, not an illegitimate <b>transfer</b>. So: <b>${esc(x.verdict)}</b>.</div></div>`);
  }

  if(S.dimensionality){
    const d = S.dimensionality;
    const xs = d.points.map(p => p.width);
    const chart = lineChart([
      {label: 'admitted by the distance gate', color: '#ffb454',
       pts: d.points.map(p => [p.width, 100 * p.admitted / d.n])},
      {label: 'found the right neighbour', color: '#1f77b4',
       pts: d.points.map(p => [p.width, 100 * p.same_pick / d.n])},
    ], xs);
    const last = d.points[d.points.length - 1];
    cards.push(`<div class="card"><h3>${esc(d.title)}</h3>
      <div class="cn">% of ${d.n} queries &middot; Case Card width, 7 real + inert</div>
      ${chart}
      <div class="lede">At <b>${last.width}</b> parameters retrieval picks the right
        neighbour <b>${last.same_pick} time${last.same_pick === 1 ? '' : 's'} in ${d.n}</b>
        &mdash; and the distance gate still admits it. Iterations only slip
        ${f2(d.warm_physics)} &rarr; <b>${f2(last.mean)}</b>, so nothing looks wrong.
        <b>A distance threshold cannot detect the failure of a distance metric.</b></div></div>`);
  }

  if(S.wide){
    const w = S.wide;
    const scan = w.scan && w.scan.length
      ? `<table class="cmp"><thead><tr><th>per-unit scatter</th>
           <th>admitted</th><th>refused as other hardware</th></tr></thead><tbody>` +
        w.scan.map(r => `<tr class="${r.refused_hardware > r.admitted ? 'alarm' : ''}">
            <td>${(r.tolerance * 100).toFixed(0)}%</td>
            <td>${r.admitted}/${r.n}</td><td>${r.refused_hardware}</td></tr>`).join('') +
        `</tbody></table>` : '';
    cards.push(`<div class="card"><h3>${esc(w.title)}</h3>
      <div class="cn">${w.parameters.swept} operating + ${w.parameters.hardware}
        hardware parameters &middot; ${w.n} cases</div>
      ${bars(w.arms.filter(a => a.label !== 'warm_gated')
               .map(a => ({...a, label: a.label === 'warm_naive' ? 'warm' : a.label})),
             {mid: 'nominal'})}
      ${scan}
      <div class="lede">Retrieval holds when the extra parameters are <b>real</b>:
        <b>26%</b> under the nominal guess. And with hardware on the Case Card the
        index separates machines by itself &mdash; <b>${w.cross_machine} of ${w.n}</b>
        neighbours came from another machine.
        <br><br>The table is the <b>hardware rule</b>, which no experiment could
        reach until hardware varied. It compares the norm of the relative
        difference against a <b>${(w.band * 100).toFixed(0)}%</b> band: same-design
        units stay admitted through 2% scatter, and at 5% &mdash; scatter as wide as
        the band &mdash; it refuses, correctly. <b>The band has to exceed the fleet's
        own scatter.</b> An exact match instead of a band refused all 200, including
        every same-machine transfer.</div></div>`);
  }

  const miss = (ev.missing || []).length
    ? `<div class="evmissing">not measured yet: ${ev.missing.join(', ')}
       &mdash; run <code>${esc(ev.reproduce)}</code></div>` : '';
  const st = ev.selftest;
  const inv = st
    ? `<div class="inv ${st.passed === st.total ? 'ok' : 'bad'}">
         invariants <b>${st.passed}/${st.total}</b> passing &middot;
         analytic Jacobian agrees with central differences to
         ${st.jacobian_worst.toExponential(1)} &middot;
         hardware defaults ${st.defaults_exact ? 'exact' : 'NOT exact'}</div>` : '';
  $('#evidence').innerHTML = miss + inv +
    `<div class="evgrid">${cards.join('')}</div>`;
}

async function boot(){
  try{
    renderHealth(await (await fetch('/api/health')).json());

    $('#backend').onchange = explain;
    // focus fires before the popup opens, so the next open is already correct
    $('#backend').addEventListener('focus', refreshHealth);
    // coming back to the tab after fixing something outside the browser
    window.addEventListener('focus', refreshHealth);
    // and a slow backstop for the case where neither of those happens
    setInterval(refreshHealth, 15000);

    // The evidence panel is decoration for the demo, so a failure here must
    // not take the pipeline down with it.
    fetch('/api/evidence').then(r => r.json()).then(drawEvidence)
      .catch(() => { $('#evidence').innerHTML =
        '<div class="evmissing">evidence unavailable</div>'; });

    SAMPLES = await (await fetch('/api/samples')).json();
    $('#samples').innerHTML = SAMPLES.map((s,i) =>
      `<button class="chip" data-i="${i}">${esc(s.name)}</button>`).join('');
    $('#samples').onclick = e => {
      const b = e.target.closest('button'); if(!b) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      $('#text').value = SAMPLES[+b.dataset.i].text;
      $('#text').dataset.name = SAMPLES[+b.dataset.i].name;
    };
    if(SAMPLES.length) document.querySelector('.chip').click();
  }catch(e){
    $('#out').innerHTML = `<div class="err">cannot reach the API: ${esc(e.message)}</div>`;
  }
}

// drag a file straight onto the textarea
const ta = $('#text');
ta.addEventListener('dragover', e => { e.preventDefault(); ta.style.borderColor = 'var(--teal)'; });
ta.addEventListener('dragleave', () => ta.style.borderColor = '');
ta.addEventListener('drop', e => {
  e.preventDefault(); ta.style.borderColor = '';
  const f = e.dataTransfer.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { ta.value = r.result; ta.dataset.name = f.name;
                     document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); };
  r.readAsText(f);
});

//: the request that produced what is on screen. An override has to re-analyse
//: *the same artifact*, not whatever the textarea happens to hold by then.
let LAST_REQ = null;

async function analyse(req){
  const btn = $('#run'); btn.disabled = true; btn.textContent = 'Analysing…';
  try{
    const res = await fetch('/api/analyse', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify(req)
    });
    if(!res.ok){
      // FastAPI's 422 detail is an array of objects, not a string — rendering it
      // straight gives the user "[object Object]", which says nothing about
      // what went wrong. Flatten anything that is not already text.
      const d = (await res.json().catch(() => ({}))).detail;
      const detail = !d ? res.statusText
        : typeof d === 'string' ? d
        : (Array.isArray(d) ? d : [d])
            .map(x => x && x.msg ? `${(x.loc||[]).slice(1).join('.')}: ${x.msg}`
                                 : JSON.stringify(x)).join('; ');
      $('#out').innerHTML = `<div class="err">HTTP ${res.status} &mdash; ${esc(detail)}</div>`;
    } else {
      LAST_REQ = req;
      draw(await res.json());
    }
  }catch(e){
    $('#out').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
  btn.disabled = false; btn.textContent = 'Analyse';
}

$('#run').onclick = () => analyse({
  text: ta.value,
  name: ta.dataset.name || 'pasted-artifact.log',
  backend: $('#backend').value });

//: The report the engineers asked for: what happened, what it means, and --
//: when the verdict is a warning rather than a fact -- the control that lets
//: them take the risk themselves. A block never renders one.
function reportBlock(r){
  if(!r) return '';
  const cls = r.severity === 'ok' ? 'ok' : r.severity === 'warn' ? 'warned' : 'blocked';
  const head = r.severity === 'ok' ? 'report'
             : r.severity === 'warn' ? 'warning &mdash; the decision is yours'
             : 'blocked &mdash; nothing here for you to decide';
  let html = `<div class="report ${cls}">
    <div class="rhead">${head}${r.override_applied ? ' &middot; override applied' : ''}</div>
    <div class="rreason">${esc(r.reason)}</div>
    <div class="rcons">${esc(r.consequence)}.</div>`;
  if(r.override_available){
    const who = localStorage.getItem('ds.operator') || '';
    html += `<div class="ovr">
      <div class="ovrhint">Accepting this warning is recorded against your name.</div>
      <input id="op" placeholder="your name" value="${esc(who)}">
      <input id="basis" placeholder="why you are accepting it">
      <button id="override-go" class="ovrbtn">Warm-start anyway</button>
    </div>`;
  }
  return html + '</div>';
}

function auditBlock(t){
  if(!t.audit || !t.audit.length) return '';
  return `<div class="audit"><div class="ahead">audit trail</div>` +
    t.audit.map(a => `<div class="arow"><span class="at">${esc(a.at)}</span> ` +
      `${esc(a.action)} by <b>${esc(a.operator || 'unattributed')}</b> ` +
      `[${esc(a.rule || '-')}] &mdash; ${esc(a.basis || 'no basis stated')}</div>`).join('') +
    `</div>`;
}

function draw(t){
  let html = '';

  // headline: the number, when there is one
  const s = t.solve;
  if(s && s.warm_iterations !== undefined && s.agreement !== undefined){
    // the nominal guess sits between the two on purpose: it is the baseline
    // the warm start actually has to beat, not the flat start
    const nominal = s.nominal_iterations !== undefined
      ? `<div class="metric"><div class="k">nominal guess</div>
           <div class="v nominal">${s.nominal_iterations}</div></div>`
      : '';
    html += `<div class="headline">
      <div class="metric"><div class="k">cold start</div>
        <div class="v cold">${s.cold_iterations}</div></div>
      ${nominal}
      <div class="arrow">&rarr;</div>
      <div class="metric"><div class="k">warm start</div>
        <div class="v warm">${s.warm_iterations}</div></div>
      <div class="metric"><div class="k">Newton iterations</div>
        <div class="v same">same answer to ${s.agreement.toExponential(1)}</div></div>
    </div>`;
  } else {
    const sev = (t.report || {}).severity;
    const cls = t.outcome.startsWith('warm_started') ? 'ok'
              : sev === 'warn' ? 'warned' : 'blocked';
    html += `<div class="verdictbar ${cls}">${esc(t.outcome)} &mdash; ${esc(t.summary||'')}</div>`;
  }

  html += reportBlock(t.report);

  // the pipeline stages
  html += '<div id="stages">';
  t.stages.forEach((st, i) => {
    const glyph = {ok:'&check;', warned:'!', blocked:'&times;'}[st.state] || '&middot;';
    let extra = '';
    const sug = st.detail && st.detail.suggestion;
    if(sug){
      const vals = Object.entries(sug.values)
        .map(([k,v]) => `${k} = <b>${fmt(v)}</b>`).join(', ');
      extra += `<div class="sugg">nearest on the ${sug.on_fields} parameters it did read:
                ${esc(sug.case_id)} (${sug.distance.toFixed(2)} away) &mdash; ${vals}</div>`;
    }
    if(st.detail && st.detail.note) extra += `<div class="note">${esc(st.detail.note)}</div>`;
    if(st.detail && st.detail.overridden && st.detail.basis)
      extra += `<div class="sugg">basis: ${esc(st.detail.basis)}</div>`;
    // Context, deliberately not a verdict. Proximity to a failed run predicts
    // whether a *case* is hard (AUC 0.77) and barely predicts whether a
    // *transfer* is legitimate (0.63), so it is stated as two distances and
    // nothing is concluded from it on screen.
    // What Layer 1 read out of an artifact from another domain. Shown because
    // the refusal is only convincing if you can see that the file *was* read:
    // "I could not parse your file" and "this is a 3D structural deck, 6 nodes,
    // linear static, and none of its fields exist in this schema" are different
    // sentences, and only one of them tells an engineer what to do next.
    const fg = st.detail && st.detail.foreign;
    if(fg){
      extra += '<div class="foreign">' + Object.entries(fg).map(([k, val]) =>
        `<div><span class="fk">${esc(k)}</span>${esc(val)}</div>`).join('') + '</div>';
    }
    const nf = st.detail && st.detail.nearest_failure;
    if(nf){
      extra += `<div class="sugg">indexed on <b>${st.detail.indexed_on}</b> parameters &middot; ` +
        `nearest of ${nf.archive_failures} failed runs: ${esc(nf.case_id)} ` +
        `(${nf.distance.toFixed(2)} away, ${esc(nf.status)})</div>`;
    }
    html += `<div class="stage ${st.state}" style="animation-delay:${i*90}ms">
       <div class="dot">${glyph}</div>
       <div><div class="name">${esc(st.title)}</div><div class="sub">${esc(st.subtitle)}</div></div>
       <div><div class="msg">${esc(st.headline)}</div>${extra}</div>
     </div>`;
  });
  html += '</div>';

  // the Case Card
  html += `<table><thead><tr><th>parameter</th><th style="text-align:right">value</th>
           <th>unit</th><th>read from</th></tr></thead><tbody>`;
  t.fields.forEach(f => {
    html += f.value === null || f.value === undefined
      ? `<tr><td>${esc(f.name)}</td><td class="miss" colspan="3">NOT READ FROM ARTIFACT</td></tr>`
      : `<tr><td>${esc(f.name)}</td><td class="num">${fmt(f.value)}</td>
           <td class="unit">${esc(f.unit)}</td><td class="raw">${esc(f.raw||'')}</td></tr>`;
  });
  html += '</tbody></table>';

  // converged state
  if(t.solution){
    html += `<table><thead><tr><th>converged state</th>
             <th style="text-align:right">value</th><th>unit</th></tr></thead><tbody>`;
    t.solution.forEach(x => {
      html += `<tr><td>${esc(x.name)}</td><td class="num">${x.value.toFixed(2)}</td>
               <td class="unit">${esc(x.unit)}</td></tr>`;
    });
    html += '</tbody></table>';
  }

  html += auditBlock(t);

  $('#out').innerHTML = html;

  // wired after the markup lands, so the handler always points at the report
  // currently on screen rather than a stale one
  const go = $('#override-go');
  if(go) go.onclick = () => {
    const operator = ($('#op').value || '').trim() || 'unattributed';
    const basis = ($('#basis').value || '').trim();
    localStorage.setItem('ds.operator', operator);
    analyse(Object.assign({}, LAST_REQ, {override:true, operator, basis}));
  };
}

boot();
</script>
</body>
</html>
