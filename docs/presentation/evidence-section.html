<!doctype html>
<!--
  Extracted from dejasolve/static/index.html on 2026-08-25.

  This is the "Evidence" section that used to render on the live Déjà Solve
  page, pulled out verbatim (CSS + markup + JS) so the same graphics can be
  reused in the presentation deck instead. It was removed from the site
  because a live demo showing curated offline benchmark numbers next to a
  live pipeline read as more "decided" than a work-in-progress deserves.

  To view these cards again: serve this file next to a running backend (so
  `fetch('/api/evidence')` resolves), or swap the boot() call at the bottom
  for a hardcoded JSON blob captured from that endpoint.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Déjà Solve — evidence section (archived)</title>
<style>
  :root{
    --bg:#0e1416; --panel:#141d20; --panel-2:#1a2529;
    --line:#070b0c; --line-soft:#1c282c;
    --ink:#e6eef0; --dim:#8fa3a9; --faint:#5d7076;
    --teal:#00b3b3; --teal-dim:#0a6b6b;
    --ok:#3ddc97; --refuse:#ff6b5e; --warn:#ffb454; --skip:#3a4a50;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  }
  body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif;margin:0}

  /* --- evidence: measured offline, shown beside the live pipeline ---------
     Labelled rather than blended in. Everything above this line is the service
     doing something now; everything below it is a number `run_all.py`
     produced. A demo that shows both without saying which is which is the
     failure mode this project is about. */
  .ev{padding:0 26px 26px}
  .ev > h2{margin:0 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.9px;
           color:var(--dim);font-weight:600}
  .ev .evsub{color:var(--faint);font-size:12px;margin-bottom:14px}
  .ev .evsub code{color:var(--teal);background:var(--panel-2);padding:2px 6px;
                  border-radius:5px;font-size:11.5px}
  /* flex, not grid: with fixed grid tracks a final row holding fewer cards than
     columns leaves the remaining tracks empty -- the two dead cells on the right
     of the last row. Flex lets that row's cards grow to consume the width. */
  .evgrid{display:flex;flex-wrap:wrap;gap:14px}
  .evgrid > .card{flex:1 1 320px;min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card h3{margin:0 0 2px;font-size:13.5px;font-weight:650}
  .card .cn{color:var(--faint);font-size:11.5px;margin-bottom:11px}
  .card .lede{font:12.5px/1.55 var(--mono);color:var(--dim);margin-top:10px}
  .card .lede b{color:var(--ink)}

  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:78px 1fr 46px;gap:9px;align-items:center;
       font:12px var(--mono)}
  .bar .bl{color:var(--dim);text-align:right}
  .bar .bt{height:15px;border-radius:4px;background:var(--teal-dim);opacity:.85}
  .bar .bv{color:var(--ink);font-weight:600}
  .bar.best .bt{background:var(--ok)} .bar.best .bv{color:var(--ok)}
  .bar.worst .bt{background:var(--refuse)} .bar.worst .bv{color:var(--refuse)}
  .bar.mid .bt{background:var(--warn)} .bar.mid .bv{color:var(--warn)}

  .cmp{width:100%;border-collapse:collapse;font:12px var(--mono)}
  .cmp th{color:var(--faint);font-size:10.5px;text-transform:uppercase;
          letter-spacing:.6px;padding:0 0 7px;text-align:right;font-weight:600}
  .cmp th:first-child{text-align:left}
  .cmp td{padding:5px 0;border-top:1px solid rgba(36,50,55,.6);text-align:right;color:var(--ink)}
  .cmp td:first-child{text-align:left;color:var(--dim)}
  .cmp tr.alarm td{color:var(--refuse);font-weight:650}
  .cmp tr.alarm td:first-child{color:var(--refuse)}
  .cmp tr.good td{color:var(--ok);font-weight:650}
  .cmp tr.good td:first-child{color:var(--ok)}

  .kv{display:flex;flex-wrap:wrap;gap:14px;margin-top:4px}
  .kv > div{min-width:88px}
  .kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--faint)}
  .kv .v{font:17px/1.3 var(--mono);font-weight:650}
  .kv .v.ok{color:var(--ok)} .kv .v.warn{color:var(--warn)} .kv .v.bad{color:var(--refuse)}
  .kv .v.dim{color:var(--dim);font-size:14px}
  .chart{margin-top:4px}
  .chart text{fill:var(--faint);font:10px var(--mono)}
  .evmissing{color:var(--warn);font:12px var(--mono);padding:10px 0}
  .card.wide{grid-column:1/-1}
  .rkgrid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .rkc .rkh{font:11px var(--mono);color:var(--faint);text-transform:uppercase;
            letter-spacing:.7px;margin-bottom:9px}
  .rkc .rkn{font:10.5px var(--mono);color:var(--faint);margin:-4px 0 7px 87px}
  .rkc .rkf{margin-top:9px;font:11.5px/1.6 var(--mono);color:var(--dim)}
  .rkc .rkf b{color:var(--ink)}
  /* the numbers above are only worth reading if the invariants under them hold */
  .inv{font:11.5px var(--mono);padding:8px 11px;margin-bottom:12px;border-radius:7px;
       border:1px solid var(--line);background:var(--panel)}
  .inv.ok{color:var(--ok);border-color:rgba(61,220,151,.35)}
  .inv.bad{color:var(--refuse);border-color:var(--refuse)}
  .inv b{color:var(--ink)}
</style>
</head>
<body>

<section class="ev">
  <h2>Evidence</h2>
  <div class="evsub">Measured offline, not computed for this page &mdash;
    regenerate every number with <code>python run_all.py</code>.</div>
  <div id="evidence"></div>
</section>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

//: Everything below renders `/api/evidence` -- numbers `run_all.py` measured,
//: never anything the service computed for this page view. The heading says so
//: rather than leaving the viewer to work out which half is which.
const f2 = v => (v === null || v === undefined) ? '-' : (+v).toFixed(2);
const f3 = v => (v === null || v === undefined) ? '-' : (+v).toFixed(3);

function bars(arms, opts){
  const vals = arms.map(a => a.mean).filter(v => v != null);
  const max = Math.max(...vals);
  const best = Math.min(...vals);
  return `<div class="bars">` + arms.map(a => {
    const cls = a.mean === best ? 'best' : a.mean === max ? 'worst'
              : (opts && opts.mid === a.label) ? 'mid' : '';
    const w = a.mean == null ? 0 : (a.mean / max) * 100;
    return `<div class="bar ${cls}"><div class="bl">${esc(a.label)}</div>` +
           `<div><div class="bt" style="width:${w}%"></div></div>` +
           `<div class="bv">${f2(a.mean)}</div></div>`;
  }).join('') + `</div>`;
}

//: A hand-drawn SVG rather than a charting library: the page is one file with
//: no CDN, and this is 30 lines. Log x because the interesting range spans 7 to
//: 1007; y is a percentage so both series share one axis honestly.
function lineChart(series, xs){
  const W = 340, H = 150, L = 30, R = 8, T = 10, B = 24;
  const lx = v => Math.log10(v);
  const x0 = lx(Math.min(...xs)), x1 = lx(Math.max(...xs));
  const px = v => L + (lx(v) - x0) / (x1 - x0) * (W - L - R);
  const py = v => H - B - (v / 100) * (H - T - B);
  const grid = [0, 50, 100].map(v =>
    `<line x1="${L}" y1="${py(v)}" x2="${W - R}" y2="${py(v)}"
           stroke="#243237" stroke-width="1"/>
     <text x="${L - 5}" y="${py(v) + 3}" text-anchor="end">${v}</text>`).join('');
  const ticks = [xs[0], xs[Math.floor(xs.length / 2)], xs[xs.length - 1]].map(v =>
    `<text x="${px(v)}" y="${H - 8}" text-anchor="middle">${v}</text>`).join('');
  const paths = series.map(s => {
    const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${px(p[0])},${py(p[1])}`).join(' ');
    const dots = s.pts.map(p =>
      `<circle cx="${px(p[0])}" cy="${py(p[1])}" r="3" fill="${s.color}"/>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"/>${dots}`;
  }).join('');
  const key = series.map((s, i) =>
    `<text x="${L + 4}" y="${T + 12 + i * 13}" fill="${s.color}">${esc(s.label)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img">
            ${grid}${ticks}${paths}${key}</svg>`;
}

function drawEvidence(ev){
  const S = ev.sections || {};
  const cards = [];

  if(S.phase1){
    const a = S.phase1;
    cards.push(`<div class="card"><h3>${esc(a.title)}</h3>
      <div class="cn">${a.n} fresh cases &middot; ${esc(a.basis)}</div>
      ${bars(a.arms, {mid: 'nominal'})}
      <div class="lede"><b>31% fewer iterations</b> than a good engineering guess.</div></div>`);
  }

  if(S.surrogate){
    const s = S.surrogate;
    cards.push(`<div class="card"><h3>${esc(s.title)}</h3>
      <div class="cn">${s.n} cases &middot; ${esc(s.basis)}</div>
      ${bars(s.arms, {mid: 'nominal'})}
      <div class="lede">Fast, and not an answer: <b>${s.were_solutions} of ${s.n}</b>
        predictions were solutions.</div></div>`);
  }

  if(S.fold){
    const f = S.fold;
    cards.push(`<div class="card"><h3>${esc(f.title)}</h3>
      <div class="cn">the fold circuit, where the guess selects the answer &middot; ${f.n} cases</div>
      <table class="cmp"><thead><tr><th></th><th>retrieval</th><th>prediction</th></tr></thead>
      <tbody>${f.rows.map(r =>
        `<tr class="${r.alarm ? 'alarm' : r.good ? 'good' : ''}">
           <td>${esc(r.label)}</td><td>${r.retrieval}</td><td>${r.prediction}</td></tr>`).join('')}
      </tbody></table>
      <div class="lede">Unverified, the prediction is wrong 40 times.
        <b>Verified, both are zero.</b></div></div>`);
  }

  if(S.failures){
    const x = S.failures;
    cards.push(`<div class="card"><h3>${esc(x.title)}</h3>
      <div class="cn">${x.archive.succeeded} solved / ${x.archive.failed} failed in the archive</div>
      <div class="kv">
        <div><div class="k">will this run die?</div>
             <div class="v ok">${f3(x.auc_hard_case)}</div></div>
        <div><div class="k">control</div>
             <div class="v dim">${f3(x.auc_control)}</div></div>
        <div><div class="k">will reuse go wrong?</div>
             <div class="v warn">${f3(x.auc_bad_transfer)}</div></div>
      </div>
      <div class="lede">They flag a hard <b>case</b>, not a bad <b>transfer</b>
        &mdash; <b>${esc(x.verdict)}</b>.</div></div>`);
  }

  if(S.dimensionality){
    const d = S.dimensionality;
    const xs = d.points.map(p => p.width);
    const chart = lineChart([
      {label: 'admitted by the distance gate', color: '#ffb454',
       pts: d.points.map(p => [p.width, 100 * p.admitted / d.n])},
      {label: 'found the right neighbour', color: '#1f77b4',
       pts: d.points.map(p => [p.width, 100 * p.same_pick / d.n])},
    ], xs);
    const last = d.points[d.points.length - 1];
    cards.push(`<div class="card"><h3>${esc(d.title)}</h3>
      <div class="cn">% of ${d.n} queries &middot; Case Card width, 7 real + inert</div>
      ${chart}
      <div class="lede"><b>A distance threshold cannot detect the failure of a
        distance metric.</b></div></div>`);
  }

  if(S.wide){
    const w = S.wide;
    const scan = w.scan && w.scan.length
      ? `<table class="cmp"><thead><tr><th>per-unit scatter</th>
           <th>admitted</th><th>refused as other hardware</th></tr></thead><tbody>` +
        w.scan.map(r => `<tr class="${r.refused_hardware > r.admitted ? 'alarm' : ''}">
            <td>${(r.tolerance * 100).toFixed(0)}%</td>
            <td>${r.admitted}/${r.n}</td><td>${r.refused_hardware}</td></tr>`).join('') +
        `</tbody></table>` : '';
    cards.push(`<div class="card"><h3>${esc(w.title)}</h3>
      <div class="cn">${w.parameters.swept} operating + ${w.parameters.hardware}
        hardware parameters &middot; ${w.n} cases</div>
      ${bars(w.arms.filter(a => a.label !== 'warm_gated')
               .map(a => ({...a, label: a.label === 'warm_naive' ? 'warm' : a.label})),
             {mid: 'nominal'})}
      ${scan}
      <div class="lede">Holds with real parameters: <b>26%</b> under nominal, and
        <b>${w.cross_machine} of ${w.n}</b> neighbours crossed machines.</div></div>`);
  }

  if(S.ranking){
    const rk = S.ranking;
    // One card, both circuits. Bars are scaled against the worst arm so the
    // bunching is the visible thing: every achievable ranker lands in the same
    // place and the oracle does not.
    const block = c => {
      const worst = Math.max(...c.arms.map(a => a.total));
      const best = Math.min(...c.arms.map(a => a.total));
      return `<div class="rkc"><div class="rkh">${esc(c.circuit)} circuit &middot;
          ${c.n} queries &middot; k=${c.k}</div>` +
        c.arms.map(a => {
          const cls = a.total === best ? 'best' : a.total === worst ? 'worst' : '';
          return `<div class="bar ${cls}"><div class="bl">${esc(a.label)}</div>
            <div><div class="bt" style="width:${(a.total / worst) * 100}%"></div></div>
            <div class="bv">${a.total}</div></div>
            <div class="rkn">${esc(a.note)}</div>`;
        }).join('') +
        `<div class="rkf">distance already picked the best candidate
           <b>${c.distance_optimal}</b> of ${c.of_admitted} times &middot;
           headroom for any ranker <b>${c.headroom_pct.toFixed(1)}%</b></div></div>`;
    };
    cards.push(`<div class="card wide"><h3>${esc(rk.title)}</h3>
      <div class="cn">the oracle solves every candidate &mdash; it is the bound, not an arm</div>
      <div class="rkgrid">${rk.circuits.map(block).join('')}</div>
      <div class="lede">${rk.model_ran
        ? `<b>Every ranker lands at or below the random floor.</b> Nothing beats
           plain distance.`
        : `Model arm not run here &mdash;
           <code>python -m benchmarks.agent_select --model granite4</code>.`}</div></div>`);
  }

  const miss = (ev.missing || []).length
    ? `<div class="evmissing">not measured yet: ${ev.missing.join(', ')}
       &mdash; run <code>${esc(ev.reproduce)}</code></div>` : '';
  const st = ev.selftest;
  const inv = st
    ? `<div class="inv ${st.passed === st.total ? 'ok' : 'bad'}">
         invariants <b>${st.passed}/${st.total}</b> passing &middot;
         analytic Jacobian agrees with central differences to
         ${st.jacobian_worst.toExponential(1)} &middot;
         hardware defaults ${st.defaults_exact ? 'exact' : 'NOT exact'}</div>` : '';
  $('#evidence').innerHTML = miss + inv +
    `<div class="evgrid">${cards.join('')}</div>`;
}

fetch('/api/evidence').then(r => r.json()).then(drawEvidence)
  .catch(() => { $('#evidence').innerHTML =
    '<div class="evmissing">evidence unavailable &mdash; serve this file with the ' +
    'backend running, or hardcode a captured /api/evidence response above.</div>'; });
</script>

</body>
</html>
