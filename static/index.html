<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déjà Solve</title>
<style>
  :root{
    --bg:#0e1416; --panel:#141d20; --panel-2:#1a2529; --line:#243237;
    --ink:#e6eef0; --dim:#8fa3a9; --faint:#5d7076;
    --teal:#00b3b3; --teal-dim:#0a6b6b;
    --ok:#3ddc97; --refuse:#ff6b5e; --warn:#ffb454; --skip:#3a4a50;
    --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;
         padding:18px 26px;border-bottom:1px solid var(--line);background:var(--panel)}
  h1{margin:0;font-size:19px;letter-spacing:.2px}
  h1 span{color:var(--teal)}
  .tagline{color:var(--dim);font-size:13px}
  .badges{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .badge{font:12px/1 var(--mono);color:var(--dim);background:var(--panel-2);
         border:1px solid var(--line);border-radius:99px;padding:6px 11px;white-space:nowrap}
  .badge b{color:var(--ink);font-weight:600}
  main{display:grid;grid-template-columns:minmax(320px,1fr) minmax(420px,1.35fr);
       gap:20px;padding:20px 26px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .panel > h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.9px;
              color:var(--dim);padding:12px 16px;border-bottom:1px solid var(--line);
              font-weight:600}
  .body{padding:16px}
  .samples{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
         background:var(--panel-2);color:var(--ink);padding:7px 12px;transition:.14s}
  button:hover{border-color:var(--teal-dim);color:var(--teal)}
  button.chip{font:12px/1 var(--mono);padding:7px 10px}
  button.chip.on{border-color:var(--teal);color:var(--teal);background:#0d2426}
  textarea{width:100%;height:260px;resize:vertical;background:var(--bg);color:var(--ink);
           border:1px solid var(--line);border-radius:8px;padding:12px;
           font:12.5px/1.55 var(--mono);tab-size:2}
  textarea:focus{outline:none;border-color:var(--teal-dim)}
  .row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .run{background:var(--teal);border-color:var(--teal);color:#04201f;font-weight:650;
       padding:9px 20px}
  .run:hover{background:#00cfcf;color:#04201f}
  .run:disabled{opacity:.5;cursor:default}
  select{font:13px var(--mono);background:var(--panel-2);color:var(--ink);
         border:1px solid var(--line);border-radius:7px;padding:8px 10px}
  .hint{color:var(--faint);font-size:12px}

  /* pipeline */
  .stage{display:grid;grid-template-columns:26px 128px 1fr;gap:12px;align-items:start;
         padding:13px 16px;border-bottom:1px solid var(--line);
         opacity:0;transform:translateY(5px);animation:in .32s ease forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .stage:last-child{border-bottom:none}
  .dot{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
       font-size:11px;font-weight:700;margin-top:1px}
  .ok .dot{background:rgba(61,220,151,.14);color:var(--ok);border:1px solid var(--ok)}
  .refused .dot{background:rgba(255,107,94,.14);color:var(--refuse);border:1px solid var(--refuse)}
  .skipped .dot{background:transparent;color:var(--skip);border:1px dashed var(--skip)}
  .stage .name{font-weight:600;font-size:13.5px}
  .stage .sub{color:var(--faint);font-size:11.5px}
  .stage .msg{font:12.8px/1.5 var(--mono);color:var(--dim);padding-top:1px}
  .ok .msg{color:var(--ink)}
  .refused .msg{color:var(--refuse)}
  .skipped .name,.skipped .sub,.skipped .msg{color:var(--skip)}
  .note{margin-top:8px;padding:9px 11px;border-left:2px solid var(--refuse);
        background:rgba(255,107,94,.06);color:var(--dim);font-size:12.5px;line-height:1.5}
  .sugg{margin-top:8px;font:12px/1.6 var(--mono);color:var(--dim)}
  .sugg b{color:var(--warn);font-weight:600}

  /* headline */
  .headline{display:flex;gap:22px;align-items:center;flex-wrap:wrap;
            padding:16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .metric .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint)}
  .metric .v{font:22px/1.15 var(--mono);font-weight:650}
  .metric .v.cold{color:var(--refuse)} .metric .v.warm{color:var(--ok)}
  .metric .v.same{color:var(--teal);font-size:17px}
  .arrow{color:var(--faint);font-size:20px}
  .verdictbar{padding:11px 16px;font:12.8px var(--mono);border-bottom:1px solid var(--line)}
  .verdictbar.ok{color:var(--ok);background:rgba(61,220,151,.07)}
  .verdictbar.refused{color:var(--refuse);background:rgba(255,107,94,.07)}

  table{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
  th{text-align:left;color:var(--faint);font-weight:600;font-size:11px;
     text-transform:uppercase;letter-spacing:.6px;padding:9px 16px;
     border-bottom:1px solid var(--line)}
  td{padding:7px 16px;border-bottom:1px solid rgba(36,50,55,.5)}
  tr:last-child td{border-bottom:none}
  td.num{text-align:right;color:var(--ink)}
  td.unit{color:var(--faint)} td.raw{color:var(--teal-dim);font-size:11.5px}
  td.miss{color:var(--refuse);letter-spacing:.5px}
  .empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:13.5px}
  .err{margin:16px;padding:12px;border:1px solid var(--refuse);border-radius:8px;
       color:var(--refuse);font:12.5px var(--mono)}
</style>
</head>
<body>
<header>
  <h1>Déjà <span>Solve</span></h1>
  <div class="tagline">Every solver run starts from zero. This one doesn't.</div>
  <div class="badges" id="badges"></div>
</header>

<main>
  <section class="panel">
    <h2>Run artifact</h2>
    <div class="body">
      <div class="samples" id="samples"></div>
      <textarea id="text" spellcheck="false"
                placeholder="Paste a solver log, an input deck, or an engineer's note — in any format, any language. Or drop a file here."></textarea>
      <div class="row">
        <button class="run" id="run">Analyse</button>
        <select id="backend" title="ingest backend"></select>
        <span class="hint" id="hint"></span>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Pipeline</h2>
    <div id="out"><div class="empty">Pick an artifact and press Analyse.</div></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => (v === null || v === undefined) ? '' :
  (Math.abs(v) >= 1e-4 && Math.abs(v) < 1e6) ? (+v.toPrecision(6)).toString()
                                             : v.toExponential(3);

let SAMPLES = [];

async function boot(){
  try{
    const h = await (await fetch('/api/health')).json();
    const B = h.backends || {};
    const ready = Object.keys(B).filter(k => B[k].available);

    $('#badges').innerHTML =
      `<span class="badge">archive <b>${h.archive_size}</b> cases</span>` +
      `<span class="badge">ingest <b>${ready.join(' + ')}</b></span>` +
      (B.ollama && B.ollama.available
        ? `<span class="badge" style="color:var(--ok)">local <b>on-prem</b></span>` : '');

    // Whatever /api/health offers is what the page offers — the list is not
    // written out here, so a backend can never exist on one side only.
    // Unavailable ones stay visible with the reason in the label; hiding them
    // is how a demo ends up with an unexplained missing feature.
    const label = {auto:'auto', hybrid:'hybrid (parser + local model)',
                   rules:'rules only (instant)',
                   ollama:'Ollama only (local)'};
    $('#backend').innerHTML =
      `<option value="auto">ingest: auto</option>` +
      Object.keys(B).map(k =>
        `<option value="${k}"${B[k].available ? '' : ' data-off="1"'}>ingest: ${label[k]||k}` +
        `${B[k].available ? '' : ' - unavailable'}</option>`).join('');

    const explain = () => {
      const o = $('#backend').selectedOptions[0];
      const k = $('#backend').value;
      $('#hint').textContent = (k === 'auto')
        ? `auto -> ${ready.includes('hybrid') ? 'hybrid' : 'rules'}`
        : (B[k] ? B[k].detail : '');
      $('#hint').style.color = (o && o.dataset.off) ? 'var(--refuse)' : '';
    };
    $('#backend').onchange = explain;
    explain();
    SAMPLES = await (await fetch('/api/samples')).json();
    $('#samples').innerHTML = SAMPLES.map((s,i) =>
      `<button class="chip" data-i="${i}">${esc(s.name)}</button>`).join('');
    $('#samples').onclick = e => {
      const b = e.target.closest('button'); if(!b) return;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      $('#text').value = SAMPLES[+b.dataset.i].text;
      $('#text').dataset.name = SAMPLES[+b.dataset.i].name;
    };
    if(SAMPLES.length) document.querySelector('.chip').click();
  }catch(e){
    $('#out').innerHTML = `<div class="err">cannot reach the API: ${esc(e.message)}</div>`;
  }
}

// drag a file straight onto the textarea
const ta = $('#text');
ta.addEventListener('dragover', e => { e.preventDefault(); ta.style.borderColor = 'var(--teal)'; });
ta.addEventListener('dragleave', () => ta.style.borderColor = '');
ta.addEventListener('drop', e => {
  e.preventDefault(); ta.style.borderColor = '';
  const f = e.dataTransfer.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => { ta.value = r.result; ta.dataset.name = f.name;
                     document.querySelectorAll('.chip').forEach(c => c.classList.remove('on')); };
  r.readAsText(f);
});

$('#run').onclick = async () => {
  const btn = $('#run'); btn.disabled = true; btn.textContent = 'Analysing…';
  try{
    const res = await fetch('/api/analyse', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ text: ta.value,
                             name: ta.dataset.name || 'pasted-artifact.log',
                             backend: $('#backend').value })
    });
    if(!res.ok){
      // FastAPI's 422 detail is an array of objects, not a string — rendering it
      // straight gives the user "[object Object]", which says nothing about
      // what went wrong. Flatten anything that is not already text.
      const d = (await res.json().catch(() => ({}))).detail;
      const detail = !d ? res.statusText
        : typeof d === 'string' ? d
        : (Array.isArray(d) ? d : [d])
            .map(x => x && x.msg ? `${(x.loc||[]).slice(1).join('.')}: ${x.msg}`
                                 : JSON.stringify(x)).join('; ');
      $('#out').innerHTML = `<div class="err">HTTP ${res.status} &mdash; ${esc(detail)}</div>`;
    } else {
      draw(await res.json());
    }
  }catch(e){
    $('#out').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
  btn.disabled = false; btn.textContent = 'Analyse';
};

function draw(t){
  let html = '';

  // headline: the number, when there is one
  const s = t.solve;
  if(s && s.warm_iterations !== undefined && s.agreement !== undefined){
    html += `<div class="headline">
      <div class="metric"><div class="k">cold start</div>
        <div class="v cold">${s.cold_iterations}</div></div>
      <div class="arrow">&rarr;</div>
      <div class="metric"><div class="k">warm start</div>
        <div class="v warm">${s.warm_iterations}</div></div>
      <div class="metric"><div class="k">Newton iterations</div>
        <div class="v same">same answer to ${s.agreement.toExponential(1)}</div></div>
    </div>`;
  } else {
    const cls = t.outcome === 'warm_started' ? 'ok' : 'refused';
    html += `<div class="verdictbar ${cls}">${esc(t.outcome)} &mdash; ${esc(t.summary||'')}</div>`;
  }

  // the pipeline stages
  html += '<div id="stages">';
  t.stages.forEach((st, i) => {
    const glyph = st.state === 'ok' ? '&check;' : st.state === 'refused' ? '&times;' : '&middot;';
    let extra = '';
    const sug = st.detail && st.detail.suggestion;
    if(sug){
      const vals = Object.entries(sug.values)
        .map(([k,v]) => `${k} = <b>${fmt(v)}</b>`).join(', ');
      extra += `<div class="sugg">nearest on the ${sug.on_fields} parameters it did read:
                ${esc(sug.case_id)} (${sug.distance.toFixed(2)} away) &mdash; ${vals}</div>`;
    }
    if(st.detail && st.detail.note) extra += `<div class="note">${esc(st.detail.note)}</div>`;
    html += `<div class="stage ${st.state}" style="animation-delay:${i*90}ms">
       <div class="dot">${glyph}</div>
       <div><div class="name">${esc(st.title)}</div><div class="sub">${esc(st.subtitle)}</div></div>
       <div><div class="msg">${esc(st.headline)}</div>${extra}</div>
     </div>`;
  });
  html += '</div>';

  // the Case Card
  html += `<table><thead><tr><th>parameter</th><th style="text-align:right">value</th>
           <th>unit</th><th>read from</th></tr></thead><tbody>`;
  t.fields.forEach(f => {
    html += f.value === null || f.value === undefined
      ? `<tr><td>${esc(f.name)}</td><td class="miss" colspan="3">NOT READ FROM ARTIFACT</td></tr>`
      : `<tr><td>${esc(f.name)}</td><td class="num">${fmt(f.value)}</td>
           <td class="unit">${esc(f.unit)}</td><td class="raw">${esc(f.raw||'')}</td></tr>`;
  });
  html += '</tbody></table>';

  // converged state
  if(t.solution){
    html += `<table><thead><tr><th>converged state</th>
             <th style="text-align:right">value</th><th>unit</th></tr></thead><tbody>`;
    t.solution.forEach(x => {
      html += `<tr><td>${esc(x.name)}</td><td class="num">${x.value.toFixed(2)}</td>
               <td class="unit">${esc(x.unit)}</td></tr>`;
    });
    html += '</tbody></table>';
  }

  $('#out').innerHTML = html;
}

boot();
</script>
</body>
</html>
